services:
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      PAEI_DATABASE_URL: sqlite:////data/energy_intelligence.db
    volumes: [energy-data:/data]
    ports: ["8000:8000"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"], interval: 15s, timeout: 5s, retries: 5}
  frontend:
    build: ./frontend
    environment: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}
    ports: ["3000:3000"]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"], interval: 15s, timeout: 5s, retries: 5}
volumes: {energy-data: {}}
